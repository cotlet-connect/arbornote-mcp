[project]
name = "arbornote-mcp"
version = "1.1.0"
description = "Connect ArborNote to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No ArborNote API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["arbornote", "arbornote api", "arbornote mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/arbornote-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=arbornote"
Source = "https://github.com/cotlet-connect/arbornote-mcp"

[project.scripts]
arbornote-mcp = "arbornote_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"arbornote_agent.py" = "arbornote_agent.py"

[tool.hatch.build.targets.sdist]
include = ["arbornote_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
